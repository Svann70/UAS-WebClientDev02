<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKopi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgKopi)" />
  <circle cx="200" cy="180" r="140" fill="#166534" opacity="0.4"/>

  <!-- Mountain Silhouette (Gunung Puntang) -->
  <polygon points="100,240 180,120 250,240" fill="#1E3A1E" opacity="0.7"/>
  <polygon points="160,240 230,100 310,240" fill="#2E4A2E" opacity="0.9"/>
  <polygon points="215,100 230,100 238,125 220,125" fill="#FEF3C7" opacity="0.5"/>

  <!-- Coffee Branch & Bean -->
  <circle cx="200" cy="225" r="42" fill="#78350F" stroke="#FDE68A" stroke-width="4"/>
  <path d="M 180 225 Q 200 200 200 225 Q 200 250 220 225" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>

  <text x="200" y="315" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FDE68A" text-anchor="middle" letter-spacing="2">KOPI PRIANGAN</text>
  <text x="200" y="342" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#86EFAC" text-anchor="middle" letter-spacing="3">GUNUNG PUNTANG</text>
</svg>