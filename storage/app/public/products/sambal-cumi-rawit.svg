<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCumi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <linearGradient id="sambalRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <filter id="cumiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#991B1B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgCumi)"/>

  <g filter="url(#cumiShadow)">
    <ellipse cx="250" cy="380" rx="90" ry="25" fill="#0F172A" opacity="0.15"/>
    
    <!-- Jar Body -->
    <rect x="170" y="160" width="160" height="200" rx="28" fill="url(#sambalRed)"/>

    <!-- Chili Seeds & Squid bits -->
    <circle cx="205" cy="210" r="3" fill="#FEF08A"/>
    <circle cx="280" cy="225" r="3" fill="#FEF08A"/>
    <circle cx="225" cy="315" r="3.5" fill="#FEF08A"/>
    <circle cx="295" cy="320" r="3" fill="#FEF08A"/>
    <!-- Baby Squid pieces -->
    <ellipse cx="220" cy="245" rx="14" ry="9" fill="#E2E8F0"/>
    <ellipse cx="275" cy="280" rx="16" ry="10" fill="#CBD5E1"/>
    <ellipse cx="210" cy="330" rx="15" ry="10" fill="#E2E8F0"/>

    <!-- Glass shine -->
    <path d="M 180 180 L 180 340" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.3"/>

    <!-- Label -->
    <rect x="180" y="225" width="140" height="70" rx="8" fill="#1C1917" stroke="#EA580C" stroke-width="2"/>
    <text x="250" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#F87171" text-anchor="middle">SAMBAL CUMI</text>
    <text x="250" y="266" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FEF08A" text-anchor="middle">CABE RAWIT 200g</text>
    <text x="250" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E5E7EB" text-anchor="middle">EKSTRA PEDAS</text>

    <!-- Black & Gold Lid -->
    <rect x="160" y="130" width="180" height="35" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="155" y="155" width="190" height="12" rx="4" fill="#0F172A"/>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="130" height="34" rx="17" fill="#DC2626"/>
  <text x="95" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">SUPER PEDAS</text>

  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#991B1B" text-anchor="middle">Sambal Cumi Asin Rawit</text>
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">Cumi Melimpah &amp; Gurih Nampol</text>
</svg>