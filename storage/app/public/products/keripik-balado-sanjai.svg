<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="baladoRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="70%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg1)"/>
  
  <!-- Plate / Banana leaf base -->
  <ellipse cx="250" cy="290" rx="190" ry="120" fill="#15803D" opacity="0.15"/>
  <ellipse cx="250" cy="285" rx="175" ry="105" fill="#FFFFFF" filter="url(#crispShadow)"/>
  <ellipse cx="250" cy="285" rx="160" ry="92" fill="#F8FAFC"/>

  <!-- Crispy Cassava Balado Chips Stack -->
  <g filter="url(#crispShadow)">
    <!-- Chip 1 -->
    <path d="M 130 290 Q 200 240 270 270 Q 230 330 150 320 Z" fill="url(#baladoRed)"/>
    <path d="M 140 280 Q 180 260 220 275" stroke="#FDE047" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Chip 2 -->
    <path d="M 220 230 Q 310 210 360 260 Q 300 320 230 280 Z" fill="url(#baladoRed)"/>
    <circle cx="280" cy="250" r="4" fill="#FEF08A" opacity="0.8"/>
    <!-- Chip 3 -->
    <path d="M 170 210 Q 250 170 320 220 Q 260 270 190 250 Z" fill="url(#baladoRed)"/>
    <!-- Chip 4 front -->
    <path d="M 190 250 Q 280 230 330 290 Q 240 330 170 290 Z" fill="url(#baladoRed)"/>
    <!-- Glistening balado gloss highlights -->
    <path d="M 210 260 Q 260 250 290 275" stroke="#FECA57" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="230" cy="270" r="3" fill="#FFF" opacity="0.8"/>
    <circle cx="270" cy="280" r="2.5" fill="#FFF" opacity="0.8"/>
    <!-- Kaffir lime leaves -->
    <path d="M 310 230 C 330 210 350 230 335 245 C 320 250 305 240 310 230 Z" fill="#15803D"/>
    <path d="M 160 300 C 180 290 190 310 175 320 C 160 320 155 310 160 300 Z" fill="#16A34A"/>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="130" height="34" rx="17" fill="#DC2626"/>
  <text x="95" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">PEDAS MANIS</text>
  
  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#78350F" text-anchor="middle">Sanjai Balado Bukittinggi</text>
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">100% Singkong Renyah Pilihan</text>
</svg>