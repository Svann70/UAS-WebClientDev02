<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJahe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="amberPouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="pouchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#B45309" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgJahe)"/>

  <g filter="url(#pouchGlow)">
    <ellipse cx="250" cy="385" rx="85" ry="18" fill="#1E293B" opacity="0.2"/>

    <path d="M 180 120 L 320 120 L 335 360 Q 250 380 165 360 Z" fill="url(#amberPouch)"/>
    <path d="M 175 145 L 325 145" stroke="#78350F" stroke-width="2"/>

    <!-- Clear Window showing Gula Semut grains -->
    <ellipse cx="250" cy="270" rx="45" ry="35" fill="#451A03" stroke="#FDE68A" stroke-width="3"/>
    <circle cx="235" cy="265" r="2" fill="#F59E0B"/>
    <circle cx="245" cy="280" r="2.5" fill="#D97706"/>
    <circle cx="260" cy="260" r="2" fill="#FDE68A"/>
    <circle cx="255" cy="275" r="2.5" fill="#FBBF24"/>

    <!-- Label Top -->
    <rect x="185" y="165" width="130" height="55" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="250" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#9A3412" text-anchor="middle">GULA SEMUT</text>
    <text x="250" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">JAHE MERAH ALAMI</text>
    
    <text x="250" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FEF08A" text-anchor="middle">ORGANIK 250 GRAM</text>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="130" height="34" rx="17" fill="#15803D"/>
  <text x="95" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">100% ORGANIK</text>

  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#78350F" text-anchor="middle">Gula Semut Jahe Merah</text>
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">Hangat Menyehatkan &amp; Manis Alami</text>
</svg>