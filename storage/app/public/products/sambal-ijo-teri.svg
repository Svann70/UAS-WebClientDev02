<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIjo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="sambalColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D7C0F" />
      <stop offset="50%" stop-color="#3F6212" />
      <stop offset="100%" stop-color="#1A2E05" />
    </linearGradient>
    <filter id="jarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgIjo)"/>
  
  <!-- Glass Jar Body -->
  <g filter="url(#jarShadow)">
    <!-- Jar Shadow base -->
    <ellipse cx="250" cy="380" rx="90" ry="25" fill="#0F172A" opacity="0.15"/>
    
    <!-- Jar Glass Container -->
    <rect x="170" y="160" width="160" height="200" rx="28" fill="url(#sambalColor)"/>
    
    <!-- Sambal Texture: Chili bits & Anchovy (Teri Medan) -->
    <circle cx="210" cy="220" r="12" fill="#65A30D"/>
    <circle cx="280" cy="240" r="15" fill="#65A30D"/>
    <circle cx="230" cy="300" r="18" fill="#4D7C0F"/>
    <circle cx="270" cy="310" r="10" fill="#84CC16"/>
    <!-- Teri Medan (Crispy Little Fish) -->
    <path d="M 200 250 Q 215 245 230 250 Q 215 255 200 250 Z" fill="#FEF08A"/>
    <path d="M 240 280 Q 260 270 280 280 Q 260 285 240 280 Z" fill="#FEF08A"/>
    <path d="M 190 320 Q 210 315 225 322 Z" fill="#FDE047"/>

    <!-- Glass reflections -->
    <path d="M 180 180 L 180 340" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <path d="M 195 180 L 195 240" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.2"/>

    <!-- Kraft Paper Label -->
    <rect x="180" y="225" width="140" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="250" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#78350F" text-anchor="middle">SAMBAL IJO</text>
    <text x="250" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">TERI MEDAN 200g</text>
    <text x="250" y="283" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#92400E" text-anchor="middle">DAPUR MINANG</text>

    <!-- Golden Metal Lid -->
    <rect x="160" y="130" width="180" height="35" rx="8" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <rect x="155" y="155" width="190" height="12" rx="4" fill="#D97706"/>
    <line x1="170" y1="138" x2="330" y2="138" stroke="#FDE68A" stroke-width="2"/>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="140" height="34" rx="17" fill="#15803D"/>
  <text x="100" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">CABAI HIJAU ASLI</text>

  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#064E3B" text-anchor="middle">Sambal Ijo Teri Padang</text>
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">Gurih Renyah &amp; Tanpa Pengawet</text>
</svg>