services:
  - type: web
    name: gandeng-web
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://gandeng-web.onrender.com
      - key: RUN_MIGRATIONS
        value: true
      - key: RUN_SEED
        value: true
      - key: DB_CONNECTION
        value: mysql
      # Nilai host, database, user, password diisi dari koneksi MySQL Render/Aiven/Railway
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
